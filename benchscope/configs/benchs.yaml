# ============================================================================
# BenchScope 引擎定义（yaml 驱动，用户可扩展）
#
# - 新增引擎 / 新版本：追加一条 engines 项（或由 Settings → Upload Engine 导入）
# - kind: builtin（自研，无环境依赖） | vllm（vLLM 原生） | sglang（SGLang 原生）
#         | native（本地权重精度评测，torch+transformers） | mock（mock 伪输出）
# - eval: 精度评测能力（serving=OpenAI 兼容链路精度 / native=本地权重精度 /
#         mock=可控伪输出精度）；缺失表示仅支持性能压测
# - requires: 环境依赖；自研/mock 引擎为空数组 → 环境校验恒通过
# - params_key: 参数说明 key，必须存在于 configs/bench-params.yaml
# - 文案字段：默认英文，*_zh 为中文（界面按当前语言选择，缺失时回退英文）
# - highlights: 仅列「简洁特性」与「版本支持情况」，不描述实现方式
# ============================================================================

# ---------------- 引擎对比表（维度 × 引擎） ----------------
comparison:
  - dimension: Engine Type
    dimension_zh: 引擎类型
    values:
      benchscope: Bench CLI (built-in)
      vllm-0.23: vLLM native (vllm bench serve)
      sglang-0.5.10: SGLang native (sglang.bench_serving)
    values_zh:
      benchscope: Bench CLI（自研内置）
      vllm-0.23: vLLM 原生（vllm bench serve）
      sglang-0.5.10: SGLang 原生（sglang.bench_serving）

  - dimension: Environment
    dimension_zh: 环境依赖
    values:
      benchscope: None (aiohttp only)
      vllm-0.23: torch >= 2.0 + vllm >= 0.23, < 0.24
      sglang-0.5.10: torch + sglang >= 0.5.10, < 0.6
    values_zh:
      benchscope: 无（仅 aiohttp）
      vllm-0.23: torch >= 2.0 + vllm >= 0.23, < 0.24
      sglang-0.5.10: torch + sglang >= 0.5.10, < 0.6

  - dimension: Test Target
    dimension_zh: 测试对象
    values:
      benchscope: Any OpenAI-compatible service
      vllm-0.23: vLLM OpenAI service
      sglang-0.5.10: SGLang OpenAI service
    values_zh:
      benchscope: 任意 OpenAI 兼容服务
      vllm-0.23: vLLM OpenAI 服务
      sglang-0.5.10: SGLang OpenAI 服务

  - dimension: Execution
    dimension_zh: 执行方式
    values:
      benchscope: In-process async (no subprocess)
      vllm-0.23: Subprocess CLI
      sglang-0.5.10: Subprocess CLI
    values_zh:
      benchscope: 进程内异步（无子进程）
      vllm-0.23: 子进程 CLI
      sglang-0.5.10: 子进程 CLI

  - dimension: Metric Basis
    dimension_zh: 指标口径
    values:
      benchscope: Aligned with vLLM bench
      vllm-0.23: vLLM official
      sglang-0.5.10: SGLang official
    values_zh:
      benchscope: 对齐 vLLM bench
      vllm-0.23: vLLM 官方口径
      sglang-0.5.10: SGLang 官方口径

  - dimension: Install Size
    dimension_zh: 安装体积
    values:
      benchscope: ~1 MB (pip extras)
      vllm-0.23: Large (full vLLM)
      sglang-0.5.10: Large (full SGLang)
    values_zh:
      benchscope: 约 1 MB（pip 附加依赖）
      vllm-0.23: 大（完整 vLLM）
      sglang-0.5.10: 大（完整 SGLang）

  - dimension: Eval Support
    dimension_zh: 精度评测
    values:
      benchscope: "Yes (serving accuracy, benchscope eval)"
      vllm-0.23: "No (performance only)"
      sglang-0.5.10: "No (performance only)"
      native-hf: "Yes (local-weight accuracy, transformers)"
      mock: "Yes (mock, controllable accuracy)"
    values_zh:
      benchscope: 支持（Serving 链路精度，benchscope eval）
      vllm-0.23: 不支持（仅性能压测）
      sglang-0.5.10: 不支持（仅性能压测）
      native-hf: 支持（本地权重精度，transformers）
      mock: 支持（mock 精度，可控正确率）

# ---------------- 引擎列表 ----------------
engines:
  # ---------------- Bench CLI 自研引擎（无需本地框架环境） ----------------
  - id: benchscope
    kind: builtin
    framework: builtin
    version: stable
    params_key: benchscope
    eval: serving
    name: Bench CLI
    description: >-
      BenchScope built-in engine (Bench CLI) — an in-process async load generator for
      OpenAI-compatible APIs. No local vLLM / SGLang installation is required, so any local
      or remote OpenAI-compatible service can be tested right after pip install.
      Metrics follow the vLLM bench definitions (TTFT / TPOT / ITL / throughput), so results
      are directly comparable with the native engines. Also provides serving-link accuracy
      evaluation via the built-in `benchscope eval` command.
    description_zh: >-
      BenchScope 自研测试引擎（Bench CLI），基于 OpenAI 兼容 API 的进程内异步流式负载生成器。
      不依赖本地 vLLM / SGLang 环境，pip 安装后即可对本地或远程的任意 OpenAI 兼容推理服务进行性能测试。
      指标口径严格对齐 vLLM bench（TTFT / TPOT / ITL / 吞吐量），结果可与原生引擎直接对比。
      同时提供 Serving 链路精度评测能力（内置命令 `benchscope eval`）。
    highlights:
      - No local framework needed — runs after pip install
      - Works with any OpenAI-compatible service (local or remote)
      - Streaming (SSE) collection — accurate TTFT / ITL
      - Accuracy evaluation via `benchscope eval` (serving link)
      - "Version support: any service version (protocol-based, no framework coupling)"
    highlights_zh:
      - 无需本地框架环境，安装即用
      - 支持任意 OpenAI 兼容服务（本地或远程）
      - SSE 流式采集，TTFT / ITL 测量准确
      - 内置 `benchscope eval` 精度评测（Serving 链路精度）
      - 版本支持：任意服务版本（基于协议，不与框架版本绑定）
    requires: []

  # ---------------- vLLM 原生引擎 ----------------
  - id: vllm-0.23
    kind: vllm
    framework: vllm
    version: "0.23"
    params_key: vllm
    name: vLLM 0.23
    description: >-
      vLLM native engine — invokes the locally installed vllm bench serve CLI.
      Metrics are the official vLLM baseline, serving as the reference for
      cross-checking Bench CLI results.
    description_zh: >-
      vLLM 原生引擎，调用本地安装的 vllm bench serve CLI 执行测试。
      指标为 vLLM 官方口径，可作为校验 Bench CLI 结果的基线参考。
    highlights:
      - Native vLLM bench (vllm bench serve)
      - Official vLLM metric baseline
      - Full set of vLLM-specific flags and datasets
      - "Version support: vLLM 0.23.x only"
    highlights_zh:
      - vLLM 原生 bench（vllm bench serve）
      - 指标即 vLLM 官方口径基线
      - 支持全部 vLLM 专属参数与数据集
      - 版本支持：仅 vLLM 0.23.x
    requires:
      - name: torch
        spec: ">=2.0"
        hint: "pip install 'torch>=2.0'"
      - name: vllm
        spec: ">=0.23,<0.24"
        hint: "pip install 'vllm>=0.23,<0.24'"

  # ---------------- SGLang 原生引擎 ----------------
  - id: sglang-0.5.10
    kind: sglang
    framework: sglang
    version: "0.5.10"
    params_key: sglang
    name: SGLang 0.5.10
    description: >-
      SGLang native engine — invokes the local python -m sglang.bench_serving CLI.
      Reports SGLang-native metrics (TPOT / ITL) for comparison with vLLM and Bench CLI.
    description_zh: >-
      SGLang 原生引擎，调用本地 python -m sglang.bench_serving CLI 执行测试。
      输出 SGLang 原生指标（TPOT / ITL），便于与 vLLM 及 Bench CLI 横向对比。
    highlights:
      - Native SGLang bench (sglang.bench_serving)
      - SGLang-native TPOT / ITL metrics
      - Supports SGLang server flags and datasets
      - "Version support: SGLang 0.5.10 only"
    highlights_zh:
      - SGLang 原生 bench（sglang.bench_serving）
      - 含 SGLang 专属 TPOT / ITL 指标
      - 支持 SGLang 服务参数与数据集
      - 版本支持：仅 SGLang 0.5.10
    requires:
      - name: torch
        spec: ">=2.0"
        hint: "pip install 'torch>=2.0'"
      - name: sglang
        spec: ">=0.5.10,<0.6"
        hint: "pip install 'sglang>=0.5.10,<0.6'"

  # ---------------- Native 原生精度引擎（transformers 本地权重） ----------------
  - id: native-hf
    kind: native
    framework: transformers
    version: stable
    params_key: native
    eval: native
    name: Native HF
    description: >-
      Native accuracy engine — loads local model weights (path or HF id) with transformers
      and runs offline inference. 100% reproducible with a fixed seed; supports LoRA
      fine-tuned incremental models via peft adapters (lora_path). Requires torch and
      transformers in the current environment (validated before selection; optional extras,
      not bundled with pip install).
    description_zh: >-
      Native 原生精度引擎，经 transformers 本地加载模型权重（路径或 HF id）离线推理。
      固定种子 100% 可复现；支持 LoRA 微调训练的增量模型（peft adapter，lora_path 配置）。
      需当前环境已安装 torch 与 transformers（选择前环境校验；可选依赖，不随 pip 必装）。
    highlights:
      - Local-weight offline inference (path or HF id)
      - Fixed seed — 100% reproducible
      - LoRA fine-tuned incremental models via peft (lora_path)
      - "Version support: torch >= 2.0 + transformers >= 4.40"
    highlights_zh:
      - 本地权重离线推理（路径或 HF id）
      - 固定种子，100% 可复现
      - 支持 LoRA 微调增量模型（peft，lora_path）
      - 版本支持：torch >= 2.0 + transformers >= 4.40
    requires:
      - name: torch
        spec: ">=2.0"
        hint: "pip install 'torch>=2.0'"
      - name: transformers
        spec: ">=4.40"
        hint: "pip install 'transformers>=4.40'"

  # ---------------- Mock 精度引擎（联调与测试，可控正确率） ----------------
  - id: mock
    kind: mock
    framework: mock
    version: stable
    params_key: mock
    eval: mock
    name: Mock
    description: >-
      Mock accuracy engine — returns deterministic pseudo answers with a controllable
      correctness rate (mock_correct_rate, default 0.7). For full-pipeline integration,
      demos and tests without GPU or a real inference service.
    description_zh: >-
      Mock 精度引擎，按样本返回确定性伪输出，正确率可控（mock_correct_rate，默认 0.7）。
      用于无 GPU / 无真实推理服务场景的全链路联调、演示与测试（mock 环境定位）。
    highlights:
      - No GPU / service needed — full pipeline offline
      - Controllable correctness rate (mock_correct_rate)
      - Deterministic outputs with fixed seed
      - "Version support: always available"
    highlights_zh:
      - 无需 GPU 与推理服务，离线全链路可跑
      - 正确率可控（mock_correct_rate）
      - 固定种子输出确定
      - 版本支持：恒可用
    requires: []
