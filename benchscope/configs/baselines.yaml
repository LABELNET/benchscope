# 开源模型基准基线库（静态固化权威公开测评分数，管理员可经 PUT /api/accuracy/baselines 更新）
#
# 字段：
#   name      基线模型名（含尺寸）
#   params_b  参数量（B，用于同尺寸段排名）
#   group     通用（general）/ 中文专项（chinese）
#   source    分数来源标注（公开技术报告 / 榜单，数值为近似参考值）
#   scores    数据集 id → 精度得分（百分制；缺失表示该数据集无公开基线）
# 注意：基线数据为静态参考值（多为 instruct/chat 版本口径），用于横向对标与档位评级，
#       不作为官方口径引用；更新基线请补充 source 标注。
