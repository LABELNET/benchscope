# 模型厂商目录（Settings → Models 面板左侧副侧边栏）
# 数据来源：https://recipes.vllm.ai 页面左侧 Providers 菜单，按 国内 / 国外 分组
# 字段：key / name（厂商名）/ homepage（厂商主页）/ models（模型名列表，空表示暂无明细）
